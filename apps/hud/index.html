<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0
     AeroFlex Telemetry HUD - single-file browser dashboard for pneumatic
     muscle controllers speaking the AeroFlex serial telemetry format.
     Docs, protocol spec, and porting guide: README.md next to this file. -->
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEROFLEX // HUD — 空気圧人工筋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">@theme{ --font-mono:"Kode Mono",ui-monospace,monospace; }</style>
<style>
  :root{
    --bg:oklch(0.2178 0 0); --fg:oklch(0.8853 0 0); --card:oklch(0.2435 0 0);
    --primary:oklch(0.6837 0.2120 40.5923); --muted:oklch(0.2850 0 0);
    --dim:oklch(0.5999 0 0); --line:oklch(0.3290 0 0);
    --green:oklch(0.74 0.17 150); --yellow:oklch(0.82 0.16 92);
    --amber:oklch(0.72 0.18 55); --red:oklch(0.6627 0.2067 24.78); --cyan:oklch(0.75 0.11 215);
    --font-mono:"Kode Mono",ui-monospace,monospace; --jp:"Noto Sans JP","Kode Mono",sans-serif;
  }
  *{ scrollbar-width:none; -ms-overflow-style:none; box-sizing:border-box; }
  *::-webkit-scrollbar{ display:none; }
  html,body{ background:var(--bg); color:var(--fg); font-family:var(--font-mono); }
  body{ isolation:isolate; min-height:100vh; text-shadow:0 0 1px currentColor,0 0 6px color-mix(in oklch,currentColor 18%,transparent);
    background-image:linear-gradient(color-mix(in oklch,var(--line) 42%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklch,var(--line) 42%,transparent) 1px,transparent 1px);
    background-size:40px 40px; background-position:center; }
  body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:60; opacity:.4;
    background:repeating-linear-gradient(0deg,transparent 0 2px,color-mix(in oklch,#000 28%,transparent) 2px 3px); mix-blend-mode:multiply; }
  .label{ text-transform:uppercase; letter-spacing:.16em; font-size:10px; color:var(--dim); }
  .jp{ font-family:var(--jp); font-weight:500; }
  .glow{ text-shadow:0 0 2px currentColor,0 0 10px color-mix(in oklch,currentColor 42%,transparent); }
  .num{ font-variant-numeric:tabular-nums; }

  /* two-layer chamfer (clean rim incl. diagonals) */
  .tile{ position:relative; isolation:isolate; background:transparent; padding:12px 14px; display:flex; flex-direction:column; min-height:120px; }
  .tile::before{ content:""; position:absolute; inset:0; z-index:-2; background:var(--line); clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px)); }
  .tile::after{ content:""; position:absolute; inset:1px; z-index:-1; background:var(--card); clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px)); }
  .thead{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .thead .lbls{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .tag{ font-size:9px; padding:1px 6px; background:var(--muted); color:var(--dim); letter-spacing:.1em; white-space:nowrap;
    clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,4px 100%,0 calc(100% - 4px)); }
  .ico{ width:13px; height:13px; stroke:var(--dim); fill:none; stroke-width:1.6; flex:none; }

  .span2{ grid-column:span 2; } .row2{ grid-row:span 2; } .spanfull{ grid-column:1/-1; }

  /* gauge */
  .gaugewrap{ position:relative; flex:1; display:flex; align-items:center; justify-content:center; min-height:158px; }
  .gsvg{ width:100%; max-width:200px; }
  .gaugectr{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .gaugeval{ font-size:44px; font-weight:700; line-height:.85; }
  .gaugeunit{ font-size:11px; color:var(--dim); letter-spacing:.12em; margin-top:3px; }
  .gaugesub{ font-size:11px; color:var(--dim); margin-top:6px; }
  .gaugedrv{ text-align:center; font-size:11px; margin-top:4px; min-height:15px; display:flex; gap:7px; align-items:baseline; justify-content:center; }
  .gaugedrv .dl{ letter-spacing:.04em; }
  .g-track{ fill:none; stroke:var(--line); stroke-width:6.5; }
  .g-danger{ fill:none; stroke:url(#hatchGray); stroke-width:6.5; transition:stroke .2s; }
  .g-val{ fill:none; stroke-width:6.5; stroke-linecap:butt; transition:stroke .2s; }
  .g-target{ stroke:var(--fg); stroke-width:2.2; }
  .tctrl{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:4px; }
  .tctrl .v{ font-size:15px; font-weight:700; min-width:54px; text-align:center; }

  /* battery bar (continuous) */
  .bar{ height:13px; margin-top:9px; background:var(--muted); position:relative; overflow:hidden;
    clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px)); }
  .bar>i{ position:absolute; inset:0 auto 0 0; background:var(--primary); box-shadow:0 0 8px color-mix(in oklch,var(--primary) 60%,transparent); transition:width .3s,background .3s; }

  /* status pieces */
  .ledc{ width:30px; height:30px; border-radius:50%; background:#15191f; border:1px solid var(--line); transition:background .08s,box-shadow .08s; }
  /* LED legend tooltip (hover the virtual LED) */
  .tile.srow{ z-index:20; }   /* lift the status card so the LED tooltip paints over the cards below */
  .ledwrap{ position:relative; cursor:help; }
  .ledtip{ position:absolute; top:calc(100% + 9px); left:0; z-index:60; width:248px; padding:10px 13px; background:var(--card); border:1px solid var(--line);
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));
    opacity:0; visibility:hidden; transform:translateY(-5px); transition:opacity .14s,transform .14s; text-shadow:none; }
  .ledwrap:hover .ledtip{ opacity:1; visibility:visible; transform:none; }
  .ledtip h4{ font-size:9px; letter-spacing:.16em; color:var(--dim); text-transform:uppercase; margin-bottom:7px; }
  .ledtip .row{ display:flex; align-items:center; gap:9px; font-size:10.5px; padding:2.5px 0; color:color-mix(in oklch,var(--fg) 82%,var(--bg)); letter-spacing:.02em; }
  .ledtip .sw{ width:11px; height:11px; border-radius:50%; flex:none; }
  .ledtip .sw.slow{ animation:swslow .9s steps(1) infinite; } .ledtip .sw.fast{ animation:swfast .3s steps(1) infinite; }
  .ledtip .sw.blip{ animation:swblip 1.1s steps(1) infinite; } .ledtip .sw.burst{ animation:swburst 1.14s steps(1) infinite; }
  @keyframes swslow{ 0%,49%{opacity:1} 50%,100%{opacity:.12} }
  @keyframes swfast{ 0%,49%{opacity:1} 50%,100%{opacity:.12} }
  @keyframes swblip{ 0%,18%{opacity:1} 19%,100%{opacity:.12} }
  @keyframes swburst{ 0%,8%{opacity:1} 8.1%,16%{opacity:.12} 16.1%,24%{opacity:1} 24.1%,32%{opacity:.12} 32.1%,40%{opacity:1} 40.1%,47%{opacity:.12} 47.1%,100%{opacity:.12} }
  .chip{ display:inline-block; padding:2px 9px; font-size:11px; font-weight:700; letter-spacing:.12em; color:currentColor; background:color-mix(in oklch,currentColor 15%,var(--bg));
    clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px)); }

  /* boot button */
  .btn{ --c:var(--primary); position:relative; isolation:isolate; text-transform:uppercase; letter-spacing:.2em; font-weight:700; font-size:.68rem; cursor:pointer; color:var(--c); background:transparent; border:0; padding:8px 14px; transition:color .18s,transform .18s; }
  .btn::before{ content:""; position:absolute; inset:0; z-index:-2; background:var(--c); clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px)); }
  .btn::after{ content:""; position:absolute; inset:1px; z-index:-1; background:var(--bg); transition:background .18s; clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px)); }
  .btn:hover:not(:disabled){ color:var(--bg); transform:translateY(-1px); } .btn:hover:not(:disabled)::after{ background:var(--c); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; } .btn.solid{ color:var(--bg); } .btn.solid::after{ background:var(--c); }
  /* mirrored chamfer (top-left + bottom-right) */
  .btn.flip::before{ clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); }
  .btn.flip::after{ clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }

  /* big action card button */
  .action{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer; min-height:60px; }
  .action .ai{ width:30px; height:30px; stroke:var(--c); fill:none; stroke-width:1.7; }
  .action .at{ font-size:15px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--c); }
  .actcard{ --c:var(--primary); }
  .actcard:hover::after{ background:color-mix(in oklch,var(--c) 14%,var(--card)); }
  .actcard.stop{ --c:var(--red); }
  .actcard.stop:hover::after{ background:var(--red); }
  .actcard.stop:hover .at{ color:var(--bg); } .actcard.stop:hover .ai{ stroke:var(--bg); } .actcard.stop:hover .jp{ color:var(--bg)!important; }
  /* e-stop engaged: full solid red card */
  .actcard.stop.engaged::before{ background:var(--red); }
  .actcard.stop.engaged::after{ background:var(--red); }
  .actcard.stop.engaged .at,.actcard.stop.engaged .ai,.actcard.stop.engaged .jp{ color:var(--bg)!important; stroke:var(--bg); }
  .actcard.gray .action{ pointer-events:none; opacity:.5; }   /* disconnected -> disabled */
  /* fill area clipped to the card chamfer (for edge-to-edge buttons) */
  .fillclip{ position:absolute; inset:1px; display:flex; clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px)); }
  /* lift/lower two-state buttons */
  .ll{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; position:relative; transition:.15s; color:var(--dim); background:transparent; border:0; font-family:inherit; }
  .ll .ai{ width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .ll .at{ font-size:14px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  .ll .jp{ color:currentColor; }
  .ll:hover:not(.active):not(.locked):not(.dis){ color:var(--fg); }
  .ll.active{ color:var(--bg); background:var(--primary); cursor:default; }  /* selected — can't re-trigger current state */
  .ll.active:hover{ color:color-mix(in oklch,var(--dim) 55%,var(--fg));         /* hovering the active one -> gray hazard, blocked */
    background:repeating-linear-gradient(135deg,color-mix(in oklch,var(--dim) 40%,transparent) 0 9px,transparent 9px 18px); }
  .ll.off{ color:var(--dim); background:color-mix(in oklch,var(--dim) 12%,transparent); }   /* alternate: plain gray, clickable */
  .ll.locked{ color:color-mix(in oklch,var(--dim) 60%,var(--bg)); cursor:not-allowed; pointer-events:none; background:transparent; }  /* lockout: no click; full-card hazard overlay shows the stripes */
  .ll.dis{ color:var(--dim); opacity:.5; cursor:not-allowed; pointer-events:none; background:color-mix(in oklch,var(--dim) 8%,transparent); }  /* offline/USB: grayed out, no actuation */
  /* two lift/lower buttons sharing one cell, stacked lift-top / lower-bottom — divider keeps them visually separate */
  .fillclip.llpair{ flex-direction:column; }
  .llpair .ll + .ll{ border-top:1px solid var(--line); }

  /* full-card hazard overlay — semi-transparent red stripes over the whole tile */
  .hazov{ position:absolute; inset:1px; z-index:5; pointer-events:none; opacity:0; transition:opacity .2s;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
    background:repeating-linear-gradient(135deg,color-mix(in oklch,var(--red) 34%,transparent) 0 9px,transparent 9px 18px); }
  .tile.hazard .hazov{ opacity:1; }
  .tile.hazard.gray .hazov{ background:repeating-linear-gradient(135deg,color-mix(in oklch,var(--dim) 40%,transparent) 0 9px,transparent 9px 18px); }  /* e-stop lockout: gray, not red */
  .tile.hazard.flash .hazov{ animation:hazflash .55s steps(1) infinite; }
  @keyframes hazflash{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }

  /* auto-cycle control — cluster holds lift/lower | cycle | e-stop; cycle sits between, taller, with its
     on/off period steppers beneath (mirrors the gauge donut + target-control layout). */
  .ctrlcluster{ display:flex; flex-wrap:wrap; gap:12px; align-items:stretch; }   /* all three tiles match the cycle tile's height */
  .ctrlcluster>*{ flex:1 1 0; min-width:150px; }
  /* the cycle toggle: same chamfer/glow/solid-when-on treatment as the other buttons */
  .cycbtn{ --c:var(--primary); position:relative; isolation:isolate; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:15px 8px; cursor:pointer; border:0; background:transparent; color:var(--c); font-family:inherit; transition:color .18s,transform .18s; }
  .cycbtn::before{ content:""; position:absolute; inset:0; z-index:-2; background:var(--c); clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px)); }
  .cycbtn::after{ content:""; position:absolute; inset:1px; z-index:-1; background:var(--bg); transition:background .18s; clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px)); }
  .cycbtn .ai{ width:26px; height:26px; stroke:var(--c); fill:none; stroke-width:1.8; }
  .cycbtn .at{ font-size:14px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--c); }
  .cycbtn .jp{ color:var(--c); }
  .cycbtn:hover:not(.dis):not(.active){ transform:translateY(-1px); } .cycbtn:hover:not(.dis):not(.active)::after{ background:color-mix(in oklch,var(--c) 14%,var(--card)); }
  .cycbtn.active::after{ background:var(--c); }                                    /* cycling -> full solid */
  .cycbtn.active .at,.cycbtn.active .ai,.cycbtn.active .jp{ color:var(--bg)!important; stroke:var(--bg); }
  .cycbtn.active{ animation:cycpulse 1.4s ease-in-out infinite; }
  @keyframes cycpulse{ 0%,100%{ filter:drop-shadow(0 0 2px var(--primary)); } 50%{ filter:drop-shadow(0 0 9px var(--primary)); } }
  .cycbtn.dis{ opacity:.4; cursor:not-allowed; pointer-events:none; }
  .cycset{ margin-top:10px; padding-top:9px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:7px; }
  .cycsethead{ display:flex; align-items:center; justify-content:space-between; }
  .tctrl.cyc{ margin-top:0; gap:9px; justify-content:space-between; }
  .tctrl.cyc>div{ text-align:center; } .tctrl.cyc .v{ min-width:58px; font-size:14px; font-weight:700; }

  /* framed (clipped body) — for data-stream */
  .framed{ position:relative; isolation:isolate; background:var(--line); padding:1px; display:flex;
    clip-path:polygon(0 0,calc(100% - 15px) 0,100% 15px,100% 100%,15px 100%,0 calc(100% - 15px)); }
  .framed-body{ flex:1; min-width:0; background:var(--card); display:flex; flex-direction:column; overflow:hidden;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
  #graph{ height:150px; flex:none; width:100%; }
  /* trend graph: own full-width row under the grid + serial */
  .trendrow{ grid-column:1/-1; } .trendrow .tile{ min-height:0; }
  /* logwrap is flex:1 with 0 basis so its content never drives the aside height -> aside can stretch to the grid row */
  .logwrap{ flex:1 1 0; min-height:0; position:relative; }
  #log{ position:absolute; inset:0; overflow-y:auto; padding:7px 11px; font:11px/1.55 var(--font-mono); color:color-mix(in oklch,var(--dim) 55%,var(--bg)); white-space:pre-wrap; }  /* faded */
  #log .f{ color:color-mix(in oklch,var(--red) 80%,var(--bg)); } #log .e{ color:color-mix(in oklch,var(--primary) 75%,var(--bg)); } #log .ok{ color:color-mix(in oklch,var(--cyan) 75%,var(--bg)); } #log .v{ color:color-mix(in oklch,var(--fg) 42%,var(--bg)); }
  .cursor{ animation:blink 1s steps(1) infinite; color:var(--primary); }
  @keyframes blink{ 0%,50%{opacity:1} 51%,100%{opacity:0} }

  /* warning bar */
  .warnbar{ display:flex; align-items:stretch; border:1px solid var(--line); background:color-mix(in oklch,var(--dim) 9%,var(--card)); }
  .warnbar .hz{ width:64px; flex:none; background:repeating-linear-gradient(135deg,color-mix(in oklch,var(--hzc,var(--dim)) 55%,transparent) 0 9px,transparent 9px 18px); }
  .warnbar .wt{ flex:1; display:flex; align-items:center; justify-content:center; gap:10px; padding:10px 14px; color:var(--fg); letter-spacing:.06em; font-size:12.5px; text-align:center; }
  .warnbar .wt b{ color:inherit; }   /* bold takes the alert (LED) color */
  .warnbar .wn{ margin-left:8px; padding:1px 6px; font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:2px; letter-spacing:.1em; }

  /* utility chrome */
  .barcode{ display:flex; gap:1px; height:22px; align-items:stretch; } .barcode i{ display:block; background:var(--fg); flex:none; } .barcode i.off{ background:transparent; }
  .dmx{ display:grid; gap:1px; } .dmx i{ background:var(--muted); } .dmx i.on{ background:var(--fg); }
  .regmark{ color:var(--dim); font-size:9px; letter-spacing:.14em; }

  .widgetgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:minmax(120px,auto); gap:12px; align-content:start; }
  @media(min-width:900px){ .widgetgrid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  aside.framed{ height:clamp(340px,52vh,560px); }   /* stacked (narrow): own height */
  @media(min-width:1000px){ main.shell{ grid-template-columns:1fr clamp(300px,22vw,440px); align-items:stretch; }
    aside.framed{ height:auto; } }                  /* wide: stretch to the grid row -> bottom-aligns with e-stop */
  /* scale up on bigger monitors so the HUD fills the space instead of pinning small + centered */
  @media(min-width:1500px){ .widgetgrid{ gap:16px; grid-auto-rows:minmax(150px,auto); } .gsvg{ max-width:250px; } .gaugeval{ font-size:52px; } }
  @media(min-width:1900px){ .widgetgrid{ gap:20px; grid-auto-rows:minmax(170px,auto); } .gsvg{ max-width:290px; } .gaugeval{ font-size:60px; } }
</style>
</head>
<body class="font-mono">

<svg width="0" height="0" style="position:absolute"><defs>
  <!-- gauge danger hatch — matches the card .hazov stripes (9px on/off feel, 135deg) but in viewBox units
       (~2.5x gauge scale -> 3.6u stripe ~= 9px on screen). rotate(135) faces the same way as the rest. -->
  <pattern id="hatchGray" width="7.2" height="7.2" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
    <rect width="3.6" height="7.2" fill="color-mix(in oklch,var(--dim) 40%,transparent)"/>
  </pattern>
  <pattern id="hatchRed" width="7.2" height="7.2" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
    <rect width="3.6" height="7.2" fill="color-mix(in oklch,var(--red) 34%,transparent)"/>
  </pattern>
</defs></svg>

<header class="flex items-center gap-3 px-4 sm:px-5 py-3 border-b border-[var(--line)] sticky top-0 z-50 backdrop-blur-sm bg-[color-mix(in_oklch,var(--bg)_82%,transparent)]">
  <div class="leading-none">
    <h1 class="text-[16px] font-bold tracking-[0.22em] glow">AEROFLEX <span class="text-[var(--primary)]">//</span> HUD</h1>
    <div class="label mt-1 jp tracking-[0.05em]">空気圧人工筋 · AEROFLEX TELEMETRY<span class="cursor">_</span></div>
  </div>
  <div class="flex-1"></div>
  <div class="hidden sm:flex items-center gap-2"><span id="connDot" class="inline-block w-2 h-2 rounded-full bg-[var(--dim)]"></span><span id="connTxt" class="label">offline</span></div>
  <button id="demoBtn" class="btn">Demo</button>
  <button id="connectBtn" class="btn solid">Connect</button>
</header>

<main class="shell grid gap-3 w-full max-w-[1680px] mx-auto p-3 sm:p-4 [grid-template-columns:1fr]">
  <section id="grid" class="widgetgrid"></section>
  <aside class="framed"><div class="framed-body">
    <div class="thead px-3 pt-3 mb-1"><span class="lbls"><span class="label">DATA STREAM</span><span class="jp label tracking-[0.05em]">通信</span></span><span class="flex gap-1.5"><button id="expLog" class="btn !text-[9px] !py-1 !px-2">exp</button><button id="clearLog" class="btn !text-[9px] !py-1 !px-2">clr</button></span></div>
    <div class="px-3 my-1 flex items-center justify-between"><span class="regmark">RAW // 115200 8N1</span><span class="regmark" id="logCount">0</span></div>
    <div class="logwrap"><div id="log"></div></div>
  </div></aside>
  <section class="trendrow">
    <div class="tile">
      <div class="thead"><span class="lbls"><span class="label">TREND</span><span class="jp label tracking-[0.05em]">推移</span></span><span class="tag">60s · PSI</span></div>
      <canvas id="graph"></canvas>
    </div>
  </section>
</main>

<footer class="label text-center text-[10px] py-3 opacity-55 jp tracking-[0.04em]">DELTA ROBOTICS ⟢ AEROFLEX HUD ⟢ 空気圧人工筋制御 ⟢ WEB-SERIAL</footer>

<script>
const $=id=>document.getElementById(id);
const C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SVGNS='http://www.w3.org/2000/svg', TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// adaptive smoothing: snap on first reading or a big real change (responsive on
// connect / fast moves), EMA-smooth only small jitter (de-jitters steady state)
const ema=(prev,raw,alpha,snap)=> (isNaN(prev)||Math.abs(raw-prev)>snap) ? raw : prev+(raw-prev)*alpha;
const isLive=()=> !!(port||demo);

/* ===== state ===== */
/* RIG CONFIGURATION - the constants below encode the reference rig; edit them
   for your hardware (see README "Adapting to your rig"):
   BAT_MIN/BAT_MAX  battery gauge window (default: 6S LiPo, 24 V solenoid floor)
   R_COIL           solenoid coil resistance, for the drive-power estimate
   psiToV           pressure-transducer transfer function (default: 150 psi, 0.5-4.5 V)
   GAUGES[].max/danger  gauge full-scale and hazard band (default: 150 psi burst, 120 psi cap) */
const ch={state:'—',fault:null,muscle:NaN,tank:NaN,target:NaN,bat:NaN,maint:false,valve:'—',lowtank:0,lowbat:0,fd:0,vd:0,tmiss:0};
const BAT_MIN=21.6, BAT_MAX=25.2;   // battery gauge 0% = 24V-coil floor (21.6V), 100% = 6S full (25.2V) — see firmware
const R_COIL=120;                   // ~24V/0.2A solenoid coil; for estimating peak-and-hold drive power
const samples=[]; const WINDOW_MS=60000;
const diag=[]; const DIAG_MAX=20000;   // rolling diagnostics buffer (~100 min @300ms) for export
let port=null,reader=null,writer=null,lineBuf='',keepReading=false; const widgets=[];
let lastActuate=0; const ACTUATE_MS=500;   // anti-spam: 500ms lockout between lift/lower presses

const psiToV=p=>isNaN(p)?NaN:(p*4/143+0.5);

/* deterministic utility graphics */
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s; }; }
function barcode(seed,bars){ const r=rng(seed); let o=''; for(let i=0;i<bars;i++){ const w=1+(r()>>4)%3, on=(r()>>8)&1; o+=`<i class="${on?'':'off'}" style="width:${w}px"></i>`; } return o; }
function datamatrix(n,seed){ const r=rng(seed); let c=''; for(let i=0;i<n*n;i++) c+=`<i class="${(r()>>6)&1?'on':''}"></i>`; return `<div class="dmx" style="grid-template-columns:repeat(${n},1fr);width:46px;height:46px">${c}</div>`; }

/* ===== gauge geometry ===== */
const polar=(cx,cy,r,f)=>{ const a=-Math.PI/2+f*TAU; return [cx+r*Math.cos(a),cy+r*Math.sin(a)]; };
function arcPath(cx,cy,r,f0,f1){ f1=clamp(f1,0,0.9999); if(f1<=f0+1e-4) return ''; const [x0,y0]=polar(cx,cy,r,f0),[x1,y1]=polar(cx,cy,r,f1); return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(f1-f0)>0.5?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }

function mkTile(cls,html){ const el=document.createElement('div'); el.className='tile '+cls; el.innerHTML=html; return el; }

    sub:v=>psiToV(v).toFixed(2)+' V', danger:0.80, hasTarget:true, target:()=>ch.target,
    incCmd:'+', decCmd:'-', simKey:'target',
    zones:[{t:0.70,c:'--amber'},{t:0.80,c:'--red'}] },
  { key:'tank', label:'SUPPLY', jp:'供給', tag:'P0', icon:'tank', max:150, unit:'PSI',
    sub:v=>psiToV(v).toFixed(2)+' V', danger:0.80, subLabel:'regulated supply',
    zones:[{t:0.70,c:'--amber'},{t:0.80,c:'--red'}] },
  // add a sensor: copy a line above + have the firmware print `key=value`.
  // { key:'temp', label:'TEMP', jp:'温度', tag:'T1', icon:'activity', max:80, unit:'°C', sub:v=>v.toFixed(1)+' °C', danger:0.9, zones:[{t:0.75,c:'--amber'},{t:0.9,c:'--red'}] },
];
function buildGauge(cfg){
  const R=40;
  const ctrls = cfg.hasTarget ? `<div class="tctrl"><button class="btn flip !px-3 !py-1" data-t="${cfg.decCmd}" style="--c:var(--dim)">−</button>
      <div><div class="label">target</div><div class="v num"><span class="tgtv">—</span> psi</div></div>
      <button class="btn !px-3 !py-1" data-t="${cfg.incCmd}" style="--c:var(--dim)">＋</button></div>` : `<div class="label text-center mt-1">${cfg.subLabel||''}</div>`;
  const el=mkTile('span2 row2',`
    <div class="hazov"></div>
    <div class="thead"><span class="lbls"><span class="label">${cfg.label}</span><span class="jp label tracking-[0.05em]">${cfg.jp}</span></span><span class="tag">${cfg.tag}</span></div>
    <div class="gaugewrap"><svg class="gsvg" viewBox="0 0 100 100">
      <circle class="g-track" cx="50" cy="50" r="${R}"/><path class="g-danger"/><path class="g-val"/><line class="g-target" style="display:none"/>
    </svg><div class="gaugectr"><div class="gaugeval num">—</div><div class="gaugeunit">${cfg.unit}</div><div class="gaugesub">— V</div></div></div>
    <div class="gaugedrv"><span class="label">drive</span> <span class="dl num">—</span></div>
    ${ctrls}`);
  const dg=el.querySelector('.g-danger'); dg.setAttribute('d', arcPath(50,50,R,cfg.danger,1));
  const valEl=el.querySelector('.gaugeval'), subEl=el.querySelector('.gaugesub'), vp=el.querySelector('.g-val'),
        tg=el.querySelector('.g-target'), tv=el.querySelector('.tgtv'), drvEl=el.querySelector('.gaugedrv .dl');
  el.querySelectorAll('[data-t]').forEach(b=> b.onclick=()=>{ send(b.dataset.t);
    if(demo && cfg.simKey){ const d=b.dataset.t===cfg.incCmd?5:-5; sim[cfg.simKey]=clamp((sim[cfg.simKey]||0)+d, cfg.key==='tank'?30:20, cfg.key==='tank'?150:110); } });
  const zoneC=f=>{ let z='--green'; for(const x of cfg.zones) if(f>=x.t) z=x.c; return z; };
  let sVal=NaN;   // smoothed reading
  return { el, update(){
    const live=isLive();
    const raw=live?ch[cfg.key]:NaN;
    if(isNaN(raw)) sVal=NaN; else sVal=ema(sVal,raw,0.4,6);     // light, snap-on-jump smoothing
    const v = live?sVal:0;                                      // disconnected -> 0
    const frac=isNaN(v)?0:clamp(v/cfg.max,0,1), danger=!!(live&&!isNaN(v)&&frac>=cfg.danger);
    const col=C(!live||isNaN(v)?'--dim':zoneC(frac));
    el.classList.toggle('hazard', !live || danger);    // offline OR red band only (warnings drive the buttons, not the gauge)
    el.classList.toggle('gray', !live);                // gray when offline
    vp.setAttribute('d', arcPath(50,50,R,0,frac)); vp.style.stroke=col; vp.style.filter='drop-shadow(0 0 3px '+col+')';
    dg.style.stroke = danger ? 'url(#hatchRed)' : 'url(#hatchGray)';   // gray, red once in the zone
    if(live && cfg.hasTarget && !isNaN(cfg.target?.())){ const tf=clamp(cfg.target()/cfg.max,0,1),[x1,y1]=polar(50,50,R-5.5,tf),[x2,y2]=polar(50,50,R+5.5,tf);
      tg.setAttribute('x1',x1.toFixed(2)); tg.setAttribute('y1',y1.toFixed(2)); tg.setAttribute('x2',x2.toFixed(2)); tg.setAttribute('y2',y2.toFixed(2)); tg.style.display=''; if(tv) tv.textContent=cfg.target().toFixed(0); }
    else { tg.style.display='none'; if(tv) tv.textContent='—'; }
    valEl.textContent = !live ? '0' : (isNaN(v)?'—':v.toFixed(0)); valEl.style.color=(!live||isNaN(v))?C('--dim'):col;
    subEl.textContent = !live ? '0.00 V' : (isNaN(v)?'— V':cfg.sub(v));
    // live solenoid drive: fill EFFORT % (proportional control window duty) + estimated coil power. SUPPLY card = FILL valve
    // (the supply gate); MUSCLE card = whichever valve is actuating it (FILL rising / VENT lowering).
    if(drvEl){
      let label=null, duty=0;
      if(live){
        if(cfg.key==='tank'){ if(ch.fd>0){ label='FILL'; duty=ch.fd; } }
        else if(ch.fd>0){ label='FILL'; duty=ch.fd; } else if(ch.vd>0){ label='VENT'; duty=ch.vd; }
      }
      if(label){ const w=Math.pow(duty/100,2)*((isNaN(ch.bat)?0:ch.bat*ch.bat))/R_COIL;   // ~ duty^2 * V^2 / R
        drvEl.textContent=`${label} ${duty}% · ${w.toFixed(1)} W`; drvEl.style.color=C('--yellow'); }
      else { drvEl.textContent = live?'idle':'—'; drvEl.style.color=C('--dim'); }
    }
  }};
}

/* ===== status (state + LED + flow + mode + fault) ===== */
function buildStatus(){
  const el=mkTile('srow spanfull !flex-row items-stretch gap-4 !min-h-0',`
    <div class="hazov"></div>
    <div id="stBar" style="width:5px;background:var(--dim)"></div>
    <div class="flex-1 min-w-0 py-1">
      <div class="thead !mb-1"><span class="lbls"><span class="label">SYSTEM STATUS</span><span class="jp label tracking-[0.05em]">状態</span></span><span class="regmark">AFX-01 // 0xA4</span></div>
      <div class="flex items-center gap-4 flex-wrap">
        <div id="stVal" class="text-[26px] font-bold glow leading-none">—</div>
        <div class="ledwrap flex items-center gap-2"><div class="ledc" id="led"></div><span id="ledName" class="label normal-case tracking-[0.08em] text-[11px]">standby</span>
          <div class="ledtip">
            <h4>LED CODES // 状態灯</h4>
            <div class="row"><span class="sw" style="background:var(--green)"></span>solid green — ready / at target</div>
            <div class="row"><span class="sw slow" style="background:var(--yellow)"></span>slow yellow — filling / moving</div>
            <div class="row"><span class="sw fast" style="background:var(--yellow)"></span>fast yellow — leak / sensor fault</div>
            <div class="row"><span class="sw blip" style="background:var(--red)"></span>slow blip red — low battery</div>
            <div class="row"><span class="sw fast" style="background:var(--red)"></span>fast red — low supply (tank)</div>
            <div class="row"><span class="sw burst" style="background:var(--red)"></span>triple-burst red — over-pressure</div>
            <div class="row"><span class="sw" style="background:var(--red)"></span>solid red — E-STOP</div>
          </div></div>
        <div class="flex items-center gap-3 ml-auto">
          <div><div class="label">flow</div><div id="flowVal" class="text-[13px] font-bold">—</div></div>
          <div><div class="label">mode</div><div id="modeVal" class="text-[13px] font-bold">—</div></div>
          <div><div class="label">alert</div><div id="faultVal" class="text-[13px] font-bold">none</div></div>
        </div>
      </div>
    </div>
    <div class="hidden lg:flex flex-col justify-center gap-1.5 pl-4 border-l border-[var(--line)]" style="min-width:250px">
      <div class="barcode" id="sbar"></div>
      <div class="flex justify-between gap-4"><span class="regmark">AEROFLEX-HUD · REV.2</span><span class="regmark">CTRL: UNO-R4 · RA4M1</span></div>
      <div class="regmark jp">FW: TELEMETRY v2 // 0x6E39 · 空気圧人工筋制御</div></div>`);
  // LED mirror
  const led=el.querySelector('#led'), ledName=el.querySelector('#ledName');
  // mirror the firmware's pickStatus() priority + BL[] codes EXACTLY
  function ls(){ const L=ch;
    if(!isLive())return{c:'--dim',n:'offline',b:'off'};
    if(L.fault==='OVER-PRESSURE')return{c:'--red',n:'OVER-PRESSURE',b:'burst'};   // red triple-burst
    if(L.fault==='LEAK'||L.fault==='SENSOR')return{c:'--yellow',n:L.fault,b:'fast'};// yellow fast
    if(L.fault==='UNDER-VOLT'||L.fault==='OVER-VOLT')return{c:'--red',n:L.fault,b:'blip'}; // red blip
    if(L.fault==='E-STOP')return{c:'--red',n:'E-STOP',b:'solid'};                  // red solid
    if(L.lowbat)return{c:'--red',n:'LOW BATT',b:'blip'};                           // red slow blip
    if(L.lowtank)return{c:'--red',n:'LOW TANK',b:'fast'};                          // red fast
    if(L.state==='RISING'||L.state==='LOWERING')return{c:'--yellow',n:'MOVING',b:'slow'};// yellow slow
    if(L.state==='BOOT')return{c:'--green',n:'BOOT',b:'solid'};                    // firmware: green during boot
    if(L.state==='—')return{c:'--dim',n:'standby',b:'off'};
    return{c:'--green',n:'READY',b:'solid'}; }                                     // green solid
  (function tick(){ const s=ls(),t=performance.now(); let on=true;
    // blink periods match firmware BL[]: slow 450/450, fast 150/150, blip 200/900, burst 3×90/90 + 600 pause
    if(s.b==='solid')on=true; else if(s.b==='off')on=false; else if(s.b==='slow')on=(t%900)<450; else if(s.b==='fast')on=(t%300)<150; else if(s.b==='blip')on=(t%1100)<200; else if(s.b==='burst'){const p=t%1140;on=(p<540)?((p%180)<90):false;}
    const col=C(s.c); led.style.background=on?col:'#15191f'; led.style.boxShadow=on?'0 0 14px '+col:'none'; ledName.textContent=s.n; requestAnimationFrame(tick); })();
  return { el, update(){
    const live=isLive();
    el.classList.toggle('hazard', !live); el.classList.toggle('gray', !live);   // offline -> gray hazard (never on fault)
    const warn = live && !ch.fault && (ch.lowtank || ch.lowbat);                 // operating warning (not a latched fault)
    const alert = ch.fault || (ch.lowtank?'LOW TANK':ch.lowbat?'LOW BATT':null); // worst active condition
    // condition color drives the big state + accent bar: red for any fault OR warning, else the state color
    const c=C(!live?'--dim':(ch.fault||warn)?'--red':({BOOT:'--cyan',IDLE:'--green',RISING:'--yellow',HOLDING:'--green',LOWERING:'--yellow',FAULT:'--red'}[ch.state]||'--dim'));
    $('stVal').textContent=!live?'OFFLINE':(ch.fault?'FAULT':ch.state); $('stVal').style.color=c; $('stBar').style.background=c; $('stBar').style.boxShadow='0 0 12px '+c;
    $('flowVal').textContent=!live?'—':(ch.valve==='FILL'?'FILL ▸':ch.valve==='VENT'?'◂ VENT':ch.valve==='closed'?'HOLD':'—');
    $('flowVal').style.color=C(!live?'--dim':ch.valve==='FILL'?'--yellow':ch.valve==='VENT'?'--yellow':ch.valve==='closed'?'--green':'--dim');
    $('modeVal').textContent=!live?'—':(isNaN(ch.bat)?'—':(ch.maint?'USB':'ARMED')); $('modeVal').style.color=C(!live?'--dim':ch.maint?'--cyan':'--green');
    $('faultVal').textContent=!live?'—':(alert||'none'); $('faultVal').style.color=C(live&&alert?'--red':'--dim');
  }};
}

/* ===== battery (continuous) ===== */
function buildBattery(){
  const el=mkTile('span2',`
    <div class="hazov"></div>
    <div class="thead"><span class="lbls"><span class="label">BATTERY</span><span class="jp label tracking-[0.05em]">電源</span></span><span class="tag">VBAT</span></div>
    <div class="text-[34px] font-bold glow leading-none num mt-1"><span id="batPct">—</span><span class="text-[14px] text-[var(--dim)] font-normal"> %</span><span id="batChip" class="ml-2"></span></div>
    <div class="bar"><i id="batFill" style="width:0%"></i></div>
    <div class="flex justify-between items-baseline mt-2"><span class="label normal-case tracking-normal text-[12px]"><span id="batV">—</span> V</span><span class="regmark">6S LiPo · 21.6-25.2 V window</span></div>`);
  const fill=el.querySelector('#batFill'), pctEl=el.querySelector('#batPct'), vEl=el.querySelector('#batV'), chip=el.querySelector('#batChip');
  let sBat=NaN;   // smoothed volts
  return { el, update(){
    const live=isLive();
    const raw=ch.bat;
    if(!live || isNaN(raw)) sBat=NaN; else sBat=ema(sBat,raw,0.2,1.0);   // snap on connect / big move, smooth jitter
    const v=sBat, present=!isNaN(v)&&!ch.maint, frac=isNaN(v)?0:clamp((v-BAT_MIN)/(BAT_MAX-BAT_MIN),0,1), pc=Math.round(frac*100);
    const crit = live && present && (pc<10 || ch.fault==='UNDER-VOLT' || ch.fault==='OVER-VOLT');  // <10% / 0% / batt fault
    el.classList.toggle('hazard', !live || crit);   // disconnected -> gray hazard; crit -> red
    el.classList.toggle('gray', !live);             // gray offline; red when crit
    el.classList.toggle('flash', crit);             // crit flashes
    pctEl.textContent = !live ? '0' : ((isNaN(v)||ch.maint)?'—':pc); vEl.textContent = !live ? '0.0' : (isNaN(v)?'—':v.toFixed(1));
    fill.style.width=((!live||ch.maint)?0:frac*100).toFixed(0)+'%';
    const col = (!live||ch.maint)?'--dim':pc>50?'--green':pc>20?'--yellow':'--red';  // no battery -> gray
    if(crit){ const rd=C('--red'); fill.style.background='repeating-linear-gradient(135deg,'+rd+' 0 6px,color-mix(in oklch,'+rd+' 25%,var(--muted)) 6px 12px)'; fill.style.boxShadow='0 0 9px '+rd; }
    else { fill.style.background=C(col); fill.style.boxShadow='0 0 8px '+C(col); }
    pctEl.style.color=(!live||isNaN(v))?C('--dim'):C(col);
    if(live && ch.maint){ chip.className='chip ml-2'; chip.style.color=C('--cyan'); chip.textContent='USB'; } else chip.textContent='';
  }};
}
/* Lift + Lower share ONE cell (same footprint as a single button) but stay two
   separate, independently-selectable buttons. Any fault locks both -> hazard overlay. */
function buildLiftLowerPair(){
  const el=mkTile('!p-0',`<div class="hazov"></div><div class="fillclip llpair">
    <button class="ll" data-cmd="f">${svgIco('up','ai')}<span class="at">Lift</span><span class="jp label tracking-[0.08em]">上昇</span></button>
    <button class="ll" data-cmd="v">${svgIco('down','ai')}<span class="at">Lower</span><span class="jp label tracking-[0.08em]">下降</span></button>
  </div>`);
  const btns=el.querySelectorAll('.ll'), lift=btns[0], lower=btns[1];
  btns.forEach(b=> b.onclick=()=>{
    // can't click: already-there (active), lockout (locked), or offline/USB (dis)
    if(['active','locked','dis'].some(c=>b.classList.contains(c))) return;
    if(performance.now()-lastActuate < ACTUATE_MS) return;       // 500ms anti-spam
    lastActuate=performance.now(); if(cycActive) stopCycle();    // manual override cancels the auto-cycle
    send(b.dataset.cmd);
  });
  return { el, update(){
    const live=isLive();
    const usb = ch.maint;                       // USB power: solenoid rail absent -> can't actuate
    const off = !live;                          // disconnected
    const fault = live && !usb && !!ch.fault;   // latched fault -> full lockout
    // cross-functional: actuation needs BOTH a good pack AND good supply. A bad
    // subsystem (low supply OR low battery) disables BOTH buttons, not just one.
    const warn = live && !usb && !fault && (ch.lowtank || ch.lowbat);
    const liftActive = live&&(ch.state==='RISING'||ch.state==='HOLDING');
    const lowerActive = live&&(ch.state==='LOWERING'||ch.state==='IDLE');
    let liftCls, lowerCls, blocked=true;
    if(off || usb){ liftCls=lowerCls=' dis'; }                 // offline / USB
    else if(fault){ liftCls=lowerCls=' locked'; }             // any fault
    else if(warn){ liftCls=lowerCls=' locked'; }              // supply / battery warning
    else { liftCls=liftActive?' active':' off'; lowerCls=lowerActive?' active':' off'; blocked=false; }
    lift.className='ll'+liftCls; lower.className='ll'+lowerCls;
    el.classList.toggle('hazard', blocked);
    el.classList.toggle('gray', blocked);    // buttons: hazard lines are ALWAYS gray when locked out, whatever the cause
  }};
}

/* ===== action cards ===== */
function buildAction(cmd,label,jp,icon,stop){
  const el=mkTile((stop?'actcard stop':'actcard')+' !p-0',`<div class="hazov"></div><div class="fillclip"><button class="action" data-cmd="${cmd}">${svgIco(icon,'ai')}<span class="at">${label}</span><span class="jp label tracking-[0.08em]" style="color:var(--c)">${jp}</span></button></div>`);
  return { el, update(){ const live=isLive();
    el.classList.toggle('hazard', !live); el.classList.toggle('gray', !live);     // offline -> gray hazard
    if(stop){ const faulted = live && !!ch.fault;                                 // ANY latched fault -> system stopped
      el.classList.toggle('engaged', faulted);                                    // full red, signals the e-stop/latched state
      const at=el.querySelector('.at'); if(at) at.textContent = faulted ? 'Clear' : 'E-Stop'; } } };  // pressing it clears the fault
}

/* ===== auto-cycle (repeatedly lift then lower on adjustable ON/OFF periods) ===== */
// ON phase = lift/pressurize (send 'f'); OFF phase = lower/vent (send 'v'). Periods are the
// seconds spent in each phase. send() bypasses the button anti-spam, so a min period caps the rate.
let cycActive=false, cycPhase=null, cycTimer=null, cycOn=2.0, cycOff=2.0;
const CYC_STEP=0.5, CYC_MIN=0.5, CYC_MAX=60;
function renderCycVals(){ const o=$('cycOnV'),f=$('cycOffV'); if(o)o.textContent=cycOn.toFixed(1); if(f)f.textContent=cycOff.toFixed(1); }
function setCycPhase(p){ cycPhase=p; const e=$('cycPhase'); if(e) e.textContent = p==='on'?'▶ ON':p==='off'?'■ OFF':'idle'; }
function cycStep(){ if(!cycActive) return;
  if(cycPhase==='on'){ setCycPhase('off'); send('v'); cycTimer=setTimeout(cycStep, cycOff*1000); }
  else            { setCycPhase('on');  send('f'); cycTimer=setTimeout(cycStep, cycOn*1000);  } }
function startCycle(){ if(cycActive) return; if(!isLive()||ch.maint||ch.fault) return;   // can't actuate offline / on USB / faulted
  cycActive=true; setCycPhase('on'); send('f'); cycTimer=setTimeout(cycStep, cycOn*1000); updateAll(); }
function stopCycle(){ cycActive=false; if(cycTimer){ clearTimeout(cycTimer); cycTimer=null; } setCycPhase(null); updateAll(); }

function buildCycle(){
  const el=mkTile('cyctile',`
    <div class="hazov"></div>
    <button class="cycbtn" id="cycToggle">${svgIco('repeat','ai')}<span class="at">Cycle</span><span class="jp label tracking-[0.08em]">循環</span></button>
    <div class="cycset">
      <div class="cycsethead"><span class="label">periods</span><span id="cycPhase" class="regmark">idle</span></div>
      <div class="tctrl cyc"><button class="btn flip !px-2.5 !py-0.5" data-cyc="on-" style="--c:var(--dim)">−</button>
        <div><div class="label">on · lift</div><div class="v num"><span id="cycOnV">2.0</span> s</div></div>
        <button class="btn !px-2.5 !py-0.5" data-cyc="on+" style="--c:var(--dim)">＋</button></div>
      <div class="tctrl cyc"><button class="btn flip !px-2.5 !py-0.5" data-cyc="off-" style="--c:var(--dim)">−</button>
        <div><div class="label">off · lower</div><div class="v num"><span id="cycOffV">2.0</span> s</div></div>
        <button class="btn !px-2.5 !py-0.5" data-cyc="off+" style="--c:var(--dim)">＋</button></div>
    </div>`);
  const toggle=el.querySelector('#cycToggle');
  toggle.onclick=()=>{ if(toggle.classList.contains('dis')) return; cycActive?stopCycle():startCycle(); };
  el.querySelectorAll('[data-cyc]').forEach(b=> b.onclick=()=>{
    const which=b.dataset.cyc.slice(0,-1), step=(b.dataset.cyc.slice(-1)==='+'?1:-1)*CYC_STEP;
    if(which==='on') cycOn=clamp(+(cycOn+step).toFixed(1),CYC_MIN,CYC_MAX);
    else             cycOff=clamp(+(cycOff+step).toFixed(1),CYC_MIN,CYC_MAX);
    renderCycVals(); });
  return { el, update(){
    const live=isLive(), usb=ch.maint;
    const fault=live && !usb && !!ch.fault;
    const warn=live && !usb && !fault && (ch.lowtank || ch.lowbat);   // same lockout logic as lift/lower
    const blocked = !live || usb || fault || warn;
    if(blocked && cycActive) stopCycle();                              // lost the ability to actuate -> auto-stop
    toggle.classList.toggle('dis', blocked);
    toggle.classList.toggle('active', cycActive);
    toggle.querySelector('.at').textContent = cycActive?'Cycling':'Cycle';
    el.classList.toggle('hazard', blocked); el.classList.toggle('gray', blocked);   // match the flanking button tiles
  }};
}

/* ===== assemble ===== */
function mount(){
  const g=$('grid');
  // full-width status, the two gauges, and the battery flow in the 4-col grid as before
  [buildStatus(), ...GAUGES.map(buildGauge), buildBattery()].forEach(w=>{ widgets.push(w); g.appendChild(w.el); });
  // bottom-right control cluster (right half of the grid, beside the battery):
  // lift/lower | CYCLE (between them, with its period settings beneath) | e-stop
  const cluster=document.createElement('div'); cluster.className='span2 ctrlcluster';
  [buildLiftLowerPair(), buildCycle(), buildAction('s','E-Stop','緊急停止','stop',true)]
    .forEach(w=>{ widgets.push(w); cluster.appendChild(w.el); });
  g.appendChild(cluster);
  document.querySelectorAll('[data-cmd]:not(.ll)').forEach(b=> b.onclick=()=>{ if(cycActive) stopCycle(); send(b.dataset.cmd); });
  const sb=$('sbar'); if(sb) sb.innerHTML=barcode(4412,52);
  renderCycVals();
}
function updateAll(){ widgets.forEach(w=>w.update()); }

/* ===== serial ===== */
$('connectBtn').onclick=()=> port?disconnect():connect();
async function openPort(p){
  stopDemo(); port=p; await port.open({baudRate:115200});
  const dec=new TextDecoderStream(); port.readable.pipeTo(dec.writable).catch(()=>{}); reader=dec.readable.getReader();
  const enc=new TextEncoderStream(); enc.readable.pipeTo(port.writable).catch(()=>{}); writer=enc.writable.getWriter();
  keepReading=true; setConn(true); readLoop();
}
async function connect(){
  if(!('serial' in navigator)){ updateWarn(); return; }
  try{ await openPort(await navigator.serial.requestPort()); }
  catch(e){ logRaw('# connect failed: '+e.message,'f'); port=null; setConn(false); }
}
// live mode is the default: silently reconnect to a previously-granted port on load
async function autoConnect(){
  if(!('serial' in navigator)) return;
  try{ const ports=await navigator.serial.getPorts(); if(ports.length) await openPort(ports[0]); }
  catch(e){ port=null; setConn(false); }
}
async function disconnect(){ keepReading=false; try{await reader?.cancel();}catch{} try{writer?.releaseLock();}catch{} try{await port?.close();}catch{} port=null;reader=null;writer=null; setConn(false); }
function setConn(on){ $('connDot').style.background=C(on?'--green':'--dim'); $('connDot').style.boxShadow=on?'0 0 9px '+C('--green'):'none'; $('connTxt').textContent=on?'接続完了 · 115200':'offline'; $('connectBtn').textContent=on?'Disconnect':'Connect'; $('connectBtn').classList.toggle('solid',!on); updateAll(); updateWarn(); }
async function readLoop(){ while(keepReading){ let r; try{ r=await reader.read(); }catch{ break; } if(r.done)break; lineBuf+=r.value;
  let i; while((i=lineBuf.indexOf('\n'))>=0){ const ln=lineBuf.slice(0,i).replace(/\r$/,''); lineBuf=lineBuf.slice(i+1); if(ln.length) handleLine(ln); } } if(keepReading) disconnect(); }
async function send(s){ if(writer){ try{ await writer.write(s); logRaw('» '+s,'e'); }catch{ logRaw('# send failed','f'); } } else { logRaw('» '+s+' (demo)','e'); if(demo) demoCmd(s); } }

function handleLine(line){
  logRaw(line, line.startsWith('!!')?'f':(line.startsWith('>')||line.startsWith('Target'))?'e':line.includes('LOG')?'ok':(line[0]==='[')?'v':'');
  const m=line.match(/\[(\w+)(?::([\w-]+))?\]/); if(!m) return;
  ch.state=m[1]; ch.fault=m[2]||null; let r;
  if(r=line.match(/m=([-\d.]+)\/([-\d.]+)/)){ ch.muscle=+r[1]; ch.target=+r[2]; }
  if(r=line.match(/\bt=([-\d.]+)/)) ch.tank=+r[1];   // tolerant of an optional trailing /value
  if(r=line.match(/bat=([-\d.]+)(\((?:USB|MAINT)\))?/)){ ch.bat=+r[1]; ch.maint=!!r[2]; }
  if(r=line.match(/valve=(\w+)/)) ch.valve=r[1];
  ch.lowtank = (r=line.match(/lowtank=([01])/)) ? +r[1] : 0;   // CO2 supply low / not connected
  ch.lowbat  = (r=line.match(/lowbat=([01])/))  ? +r[1] : 0;   // pack voltage warning
  ch.fd = (r=line.match(/\bfd=(\d+)/)) ? +r[1] : 0;            // FILL solenoid duty % (peak-and-hold)
  ch.vd = (r=line.match(/\bvd=(\d+)/)) ? +r[1] : 0;            // VENT solenoid duty %
  ch.tmiss = (r=line.match(/tmiss=([01])/)) ? +r[1] : 0;       // soft: can't reach target (supply too low for it)
  for(const mm of line.matchAll(/\b([a-z][a-z0-9_]+)=([-\d.]+)\b/g)){ if(!(mm[1] in ch)) ch[mm[1]]=+mm[2]; }
  const ts=performance.now(); samples.push({ts,muscle:ch.muscle,tank:ch.tank}); const cut=ts-WINDOW_MS; while(samples.length&&samples[0].ts<cut) samples.shift();
  // diagnostics capture (for export / troubleshooting)
  diag.push({t:Date.now(), src:demo?'demo':'live', state:ch.state, fault:ch.fault||'', muscle:ch.muscle, target:ch.target, tank:ch.tank, bat:ch.bat, maint:ch.maint?1:0, valve:ch.valve, lowtank:ch.lowtank, lowbat:ch.lowbat, raw:line});
  if(diag.length>DIAG_MAX) diag.shift();
  updateAll(); drawGraph(); updateWarn();
}
let logN=0;
function logRaw(line,cls){ const el=$('log'); const atB=el.scrollTop+el.clientHeight>=el.scrollHeight-6;
  const s=document.createElement('span'); if(cls)s.className=cls; s.textContent=line+'\n'; el.appendChild(s);
  while(el.childNodes.length>400) el.removeChild(el.firstChild); if(atB) el.scrollTop=el.scrollHeight; $('logCount').textContent=(++logN); }
$('clearLog').onclick=()=>{ $('log').textContent=''; };
/* ===== diagnostics export (CSV: every captured telemetry sample + raw line) ===== */
function csvCell(v){ const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportDiag(){
  if(!diag.length){ logRaw('# no diagnostics captured yet','f'); return; }
  const cols=['iso','ms','src','state','fault','muscle','target','tank','bat','maint','valve','lowtank','lowbat','raw'];
  const rows=[cols.join(',')];
  for(const d of diag) rows.push([new Date(d.t).toISOString(),d.t,d.src,d.state,d.fault,d.muscle,d.target,d.tank,d.bat,d.maint,d.valve,d.lowtank,d.lowbat,d.raw].map(csvCell).join(','));
  const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const blob=new Blob([rows.join('\n')],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='aeroflex_diag_'+stamp+'.csv'; a.click(); URL.revokeObjectURL(url);
  logRaw(`# exported ${diag.length} samples -> aeroflex_diag_${stamp}.csv`,'ok');
}
$('expLog').onclick=exportDiag;

/* ===== graph ===== */
const gcv=$('graph'), gx=gcv.getContext('2d');
function gResize(){ gcv.width=gcv.clientWidth*devicePixelRatio; gcv.height=150*devicePixelRatio; gx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); drawGraph(); }
window.addEventListener('resize',gResize);
function drawGraph(){
  const W=gcv.clientWidth,H=150,yMax=150; gx.clearRect(0,0,W,H);
  gx.strokeStyle=C('--line'); gx.lineWidth=1; gx.fillStyle=C('--dim'); gx.font='9px "Kode Mono",monospace';
  for(let g=0;g<=150;g+=30){ const y=H-(g/yMax)*H; gx.globalAlpha=.5; gx.beginPath(); gx.moveTo(20,y); gx.lineTo(W,y); gx.stroke(); gx.globalAlpha=1; gx.fillText(String(g),2,y+3); }
  if(samples.length<2) return; const now=performance.now(),t0=now-WINDOW_MS, X=ts=>20+((ts-t0)/WINDOW_MS)*(W-20), Y=v=>H-(clamp(v,0,yMax)/yMax)*H;
  const ln=(k,col,glow)=>{ const c=C(col); gx.strokeStyle=c; gx.lineWidth=1.8; gx.shadowColor=glow?c:'transparent'; gx.shadowBlur=glow?6:0; gx.beginPath(); let st=false;
    for(const s of samples){ if(isNaN(s[k]))continue; const x=X(s.ts),y=Y(s[k]); st?gx.lineTo(x,y):gx.moveTo(x,y); st=true; } gx.stroke(); gx.shadowBlur=0; };
  ln('tank','--cyan',false); ln('muscle','--primary',true);
}

/* ===== warning / alert (gray; shows full fault descriptions) ===== */
const FAULTDESC={
  'OVER-PRESSURE':'Muscle exceeded the 120 PSI cap — auto-vented; sustained over-pressure latched a full vent shutdown.',
  'LEAK':'Rapid pressure loss while pressurized — fill solenoid isolated to conserve CO₂. System latched.',
  'SENSOR':'Implausible sensor reading (out of range). Vented to a safe state.',
  'UNDER-VOLT':'Pack voltage below the 24 V-coil floor (~21.6 V) — valves can no longer reliably open. Vented + locked out.',
  'OVER-VOLT':'Pack voltage above 26 V — wrong or over-charged battery. Vented + locked out.',
  'E-STOP':'Emergency stop engaged — muscle vented, system latched off. Clear to resume.'
};
let warnEl=null, currentAlerts=[], warnIdx=0;
// alert color == the LED color code for that condition (see ls()/firmware BL[])
const FAULTCOL={'OVER-PRESSURE':'--red','LEAK':'--yellow','SENSOR':'--yellow','UNDER-VOLT':'--red','OVER-VOLT':'--red','E-STOP':'--red'};
/* build the list of active alerts (highest-severity first) */
function computeAlerts(){
  const a=[]; const noSerial=!('serial' in navigator); const live=port||demo;
  if(live && ch.fault) a.push({col:FAULTCOL[ch.fault]||'--red', html:`<b>⚠ ${ch.fault}</b> — ${FAULTDESC[ch.fault]||'fault active; system latched to a safe state.'}`});
  if(live && ch.lowtank) a.push({col:'--red', html:`<b>LOW SUPPLY</b> — CO₂ tank pressure low or not connected; can't pressurize the muscle. <span class="jp">供給圧力低下</span>`});  // LED: red fast
  if(live && ch.tmiss && !ch.lowtank) a.push({col:'--amber', html:`<b>CAN'T REACH TARGET</b> — supply pressure too low to reach the target; holding where it can. Recharge supply or lower the target. <span class="jp">目標到達不可</span>`});  // soft, non-blocking
  if(noSerial) a.push({col:'--amber', html:'BROWSER UNSUPPORTED — USE CHROME / EDGE <span class="jp">非対応ブラウザ</span>'});
  if(!port) a.push({col:'--dim', html:'NO DEVICE CONNECTED — AWAITING CONTROLLER <span class="jp">機器未接続</span>'+(demo?' · DEMO DATA':'')});
  if(live && !ch.maint && !isNaN(ch.bat)){
    const pc=Math.round(clamp((ch.bat-BAT_MIN)/(BAT_MAX-BAT_MIN),0,1)*100);
    if(pc<=20 || ch.lowbat) a.push({col:'--red', html:`<b>BATTERY ${pc}%</b> — pack low; below ~21.6 V the 24 V valves stop actuating. <span class="jp">電池残量低下</span>`});  // LED: red blip
  }
  return a;
}
function renderWarn(){
  if(!warnEl || !currentAlerts.length) return;
  if(warnIdx>=currentAlerts.length) warnIdx=0;
  const al=currentAlerts[warnIdx], n=currentAlerts.length, col=C(al.col||'--dim');
  const ctr = n>1 ? `<span class="wn">${warnIdx+1}/${n}</span>` : '';
  warnEl.style.setProperty('--hzc', col);   // side hazard stripes take the LED color
  warnEl.innerHTML=`<div class="hz"></div><div class="wt" style="color:${col}">${al.html}${ctr}</div><div class="hz"></div>`;   // label color == LED color, no icon
}
function updateWarn(){
  currentAlerts=computeAlerts();
  const show=currentAlerts.length>0;
  if(show && !warnEl){ warnEl=document.createElement('div'); warnEl.className='warnbar spanfull'; $('grid').parentElement.insertBefore(warnEl, $('grid')); }
  if(!show && warnEl){ warnEl.remove(); warnEl=null; warnIdx=0; return; }
  renderWarn();
}
setInterval(()=>{ if(currentAlerts.length>1){ warnIdx=(warnIdx+1)%currentAlerts.length; renderWarn(); } }, 3500);

/* ===== demo ===== */
let demo=false,demoTimer=null;
const sim={state:'IDLE',m:6,t:101,bat:25.2,target:90,valve:'closed',ph:0,fault:null};
const rnd=a=>(Math.random()*2-1)*a;
$('demoBtn').onclick=()=> demo?stopDemo():startDemo();
function startDemo(){ if(port) return; demo=true; $('demoBtn').classList.add('solid'); $('demoBtn').textContent='Demo·on'; updateAll(); updateWarn(); demoTimer=setInterval(demoStep,160); }
function stopDemo(){ demo=false; clearInterval(demoTimer); $('demoBtn').classList.remove('solid'); $('demoBtn').textContent='Demo'; updateAll(); updateWarn(); }
function demoCmd(c){ if(c==='f'){ sim.fault=null; sim.state='RISING'; sim.ph=0; } else if(c==='v'){ sim.fault=null; sim.state='LOWERING'; sim.ph=0; } else if(c==='s'){ sim.fault=sim.fault?null:'E-STOP'; } }
function demoStep(){ const s=sim; s.ph++;
  s.bat-=0.05; if(s.bat<19.5) s.bat=25.2;   // cycle so you see green -> yellow -> red -> flashing
  // fd = proportional fill effort (tapers as it nears target); vd = vent pull-in/hold
  const fillEffort=()=> clamp(Math.round(((s.target+5)-s.m)/15*100),25,100);
  const tail=()=>` t=${s.t.toFixed(1)} bat=${s.bat.toFixed(1)} valve=${s.valve}`
    +` fd=${s.valve==='FILL'?fillEffort():0} vd=${s.valve==='VENT'?(s.ph<2?100:63):0}`
    +` lowtank=${(s.state==='RISING'||s.state==='LOWERING')?0:(s.t<30?1:0)} tmiss=0 lowbat=0`;
  if(s.fault){ s.valve=s.m>5?'VENT':'closed'; s.m=Math.max(0,s.m-5); handleLine(`[FAULT:${s.fault}] m=${s.m.toFixed(1)}/${s.target}`+tail()); return; }
  if(s.state==='IDLE'){ s.valve='closed'; s.m=Math.max(2,s.m+rnd(.3)); s.t=Math.min(101,s.t+0.6)+rnd(.3); if(s.ph>14){s.state='RISING';s.ph=0;} }
  else if(s.state==='RISING'){ s.valve='FILL'; s.m+=4+rnd(.6); s.t=Math.max(90,s.t-1.4)+rnd(.4); if(s.m>=s.target){s.m=s.target+5;s.state='HOLDING';s.ph=0;} }
  else if(s.state==='HOLDING'){ s.valve='closed'; s.m=s.target+2.5+rnd(2.5); s.t=Math.min(101,s.t+0.8)+rnd(.3); if(s.ph>26){s.state='LOWERING';s.ph=0;} }   // overpressure operating zone
  else if(s.state==='LOWERING'){ s.valve='VENT'; s.m=Math.max(0,s.m-5+rnd(.5)); s.t=Math.min(101,s.t+0.4)+rnd(.3); if(s.m<5){s.state='IDLE';s.ph=0;} }
  handleLine(`[${s.state}] m=${s.m.toFixed(1)}/${s.target}`+tail());
}

mount(); gResize(); updateAll(); updateWarn();
autoConnect();   // live mode is the default — reconnect to a known port, else show the offline (gray-hazard) state
</script>
</body>
